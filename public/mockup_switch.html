<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .card { background: #111; border: 1px solid #333; padding: 40px; border-radius: 20px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #f472b6; font-size: 24px; margin-bottom: 10px; }
        p { color: #ccc; font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn.outline { background: transparent; border: 1px solid #444; color: #fff; }
        .icon { font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✨</div>
        <h1>Success!</h1>
        <p>Your account upgraded to Creator.<br>To start posting content, please download the Zexy Creator app.</p>
        
        <a href="#" class="btn">Download for iOS</a>
        <a href="#" class="btn">Download for Android</a>
        <a href="#" class="btn outline">Back to Profile</a>
    </div>
</body>
</html>
